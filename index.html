<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VAULTFALL - 2.5D Kingdom & Pinch Zoom</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>

<div id="hud">
  <div class="glass">
    <div style="font-size:10.5px">❤️ <b id="hp">100</b> &nbsp; 🎯 <b id="kills">0</b> &nbsp; 👕 <span id="skinName" style="color:#ffd700">Default</span></div>
    <div id="hpBar"><div id="hpFill"></div></div>
  </div>
  <div class="glass" style="text-align:right">
    <div style="font-size:10.5px">💰 <b id="gold" style="color:#ffd700">400</b> &nbsp; ⏰ <b id="time">180</b>s</div>
    <div style="font-size:9.5px;opacity:.9">🏰 <span id="layer">আমার রাজ্য</span></div>
  </div>
</div>

<div id="topCenter">
  <div id="classBar">
    <button class="cbtn active" onclick="setClass('Breaker',this)">🔨 Breaker</button>
    <button class="cbtn" onclick="setClass('Ghost',this)">👻 Ghost</button>
    <button class="cbtn" onclick="setClass('Guardian',this)">🛡️ Guardian</button>
    <button class="cbtn" onclick="setClass('Hunter',this)">🎯 Hunter</button>
  </div>
  <div id="msg">✌️ দুই আঙুলে জুম করো, রাজ্য সাজাও ও শত্রু রাজ্য লুট করো!</div>
</div>

<div id="zoomBar">
  <button class="zbtn" onclick="changeZoom(-0.15)">-</button>
  <span id="zoomLabel">1.0x</span>
  <button class="zbtn" onclick="changeZoom(0.15)">+</button>
</div>

<div id="killFeed"></div>
<div id="center"></div>

<button id="hudEditBtn" onclick="toggleHudEdit()">🎛️ HUD EDIT</button>
<button id="hudResetBtn" onclick="resetHudPositions()">↺ Reset</button>
<button id="buildToggle" class="hudBtn" onclick="toggleBuildMode()">🏗️ রাজ্য সাজাও</button>
<button id="startRaidBtn" onclick="startRaidFromEdit()">⚔️ যুদ্ধ শুরু করো</button>

<div id="buildDock">
  <button class="bitem active" onclick="selectBuild('tower',this)">🗼 টাওয়ার<br><span style="color:#ffd700">💰 80</span></button>
  <button class="bitem" onclick="selectBuild('factory',this)">🏭 ফ্যাক্টরি<br><span style="color:#ffd700">💰 100</span></button>
  <button class="bitem" onclick="selectBuild('camp',this)">⛺ তাবু/ঘর<br><span style="color:#ffd700">💰 60</span></button>
  <button class="bitem" onclick="selectBuild('fountain',this)">⛲ বাগান/ঝর্না<br><span style="color:#ffd700">💰 50</span></button>
  <button class="bitem del" onclick="selectBuild('delete',this)">🗑️ মুছুন<br><span style="color:#ff8a80">ফেরত</span></button>
</div>

<div id="joy" class="hudBtn"><div id="knob"></div></div>
<button id="fire" class="hudBtn">🔥 FIRE</button>
<button id="skill" class="hudBtn">⚡ SKILL</button>
<button id="jump" class="hudBtn">⬆️</button>

<div id="lobby">
  <div style="font-size:40px">🏰</div>
  <div id="logo">VAULTFALL</div>
  <div style="color:#ffd700;font-weight:700;letter-spacing:2px;font-size:10px">2.5D ISOMETRIC KINGDOM • PINCH ZOOM</div>
  <p style="opacity:.9;margin:6px 0;font-size:12px;line-height:1.45">দুই আঙুলে জুম করে নিজের রাজ্য সাজাও → শত্রু রাজ্যের লাল ভল্ট লুট করো → নিজের ভল্টে গোল্ড জমা রাখো!</p>
  <div class="skinRow" id="skinRow"></div>
  <div class="lobbyBtns">
    <button id="editKingdomBtn" onclick="enterKingdomEditor()">🏗️ আগে আমার রাজ্য সাজাই</button>
    <button id="play" onclick="startGame(false)">⚔️ সরাসরি যুদ্ধে নামো!</button>
  </div>
</div>
</div>

<script src="js/zoom.js"></script>
<script src="js/hud.js"></script>
<script src="js/kingdom.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
